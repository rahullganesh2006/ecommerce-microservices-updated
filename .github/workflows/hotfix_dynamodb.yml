name: 'Hotfix DynamoDB Tables'

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/hotfix_dynamodb.yml'

jobs:
  create-tables:
    runs-on: ubuntu-latest
    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Create Products Table
      continue-on-error: true
      run: |
        aws dynamodb create-table --table-name rahull-products \
          --attribute-definitions AttributeName=product_id,AttributeType=S \
          --key-schema AttributeName=product_id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST

    - name: Create Cart Table
      continue-on-error: true
      run: |
        aws dynamodb create-table --table-name rahull-cart \
          --attribute-definitions AttributeName=cart_id,AttributeType=S \
          --key-schema AttributeName=cart_id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST

    - name: Create Inventory Table
      continue-on-error: true
      run: |
        aws dynamodb create-table --table-name rahull-inventory \
          --attribute-definitions AttributeName=inventory_id,AttributeType=S \
          --key-schema AttributeName=inventory_id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST

    - name: Create Orders Table
      continue-on-error: true
      run: |
        aws dynamodb create-table --table-name rahull-orders \
          --attribute-definitions AttributeName=order_id,AttributeType=S \
          --key-schema AttributeName=order_id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST

    - name: Create Payments Table
      continue-on-error: true
      run: |
        aws dynamodb create-table --table-name rahull-payments \
          --attribute-definitions AttributeName=payment_id,AttributeType=S \
          --key-schema AttributeName=payment_id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST
