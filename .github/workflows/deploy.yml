name: 'Deploy App'

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, cart-service, inventory-service, notification-service, order-service, payment-service, product-service]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Build and Package
      run: |
        cd ${{ matrix.service }}
        mkdir -p package
        pip install --platform manylinux2014_x86_64 --target=package --implementation cp --python-version 3.11 --only-binary=:all: --upgrade -r requirements.txt
        cp -r *.py package/ || true
        cp -r routers package/ || true
        cp -r schemas package/ || true
        cp -r services package/ || true
        cp -r clients package/ || true
        cp -r repositories package/ || true
        cd package
        zip -r ../${{ matrix.service }}.zip .

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy to Lambda
      run: |
        aws lambda update-function-code \
          --function-name angadi-hub-${{ matrix.service }} \
          --zip-file fileb://${{ matrix.service }}/${{ matrix.service }}.zip

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Frontend
      run: |
        cd frontend-ui
        npm install
        npm run build

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Deploy to S3
      run: |
        # In a real environment, you'd pull the bucket name from Terraform outputs. 
        # Here we assume it's stored in a GitHub Secret for the action.
        aws s3 sync frontend-ui/.output/public/ s3://${{ secrets.S3_BUCKET_NAME }} --delete

    - name: Invalidate CloudFront
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} \
          --paths "/*"
