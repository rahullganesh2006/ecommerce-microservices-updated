version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm install
            - env | grep VITE_ > .env
        build:
          commands:
            - export NITRO_PRESET=aws-amplify
            - npm run build
      artifacts:
        baseDirectory: .amplify-hosting
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    appRoot: frontend-ui
