# SonarQube / SonarCloud Configuration File

# Project Identification
sonar.projectKey=ecommerce-microservices-updated
sonar.organization=rahullganesh2006-github

# Project Metadata
sonar.projectName=E-Commerce Microservices
sonar.projectVersion=1.0

# Paths to scan
# We include all microservice directories
sonar.sources=auth-service,cart-service,inventory-service,notification-service,order-service,payment-service,product-service

# Paths to exclude from analysis (e.g., tests, venv, packages)
sonar.exclusions=**/tests/**,**/venv/**,**/package/**,**/.pytest_cache/**,**/__pycache__/**,**/*.zip,scratch/**,_archive/**

# Python Configuration
sonar.python.version=3.11
